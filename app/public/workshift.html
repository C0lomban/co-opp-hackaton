<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CoopOS Workshifts</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #f6f3ec; --panel: #fffdf8; --ink: #1f2420; --muted: #6b6f68; --line: #e3ded2;
    --accent: #2f5d50; --pass: #2e7d4f; --pass-bg: #e3f2e8; --fail: #b3261e; --fail-bg: #fbe5e3; --unc: #9a6700; --unc-bg: #fdf1d6;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 Inter, system-ui, sans-serif; }
  header { padding: 22px 32px; display: flex; align-items: baseline; gap: 14px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  header h1 { font-family: Fraunces, serif; font-size: 26px; margin: 0; }
  header p { margin: 0; color: var(--muted); }
  .tabs { display: flex; gap: 4px; } .tab { font-size: 13px; font-weight: 600; color: var(--muted); text-decoration: none; padding: 5px 12px; border-radius: 999px; border: 1px solid var(--line); background: #fff; }
  .tab.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  main { display: grid; grid-template-columns: minmax(320px, 440px) 1fr; gap: 24px; padding: 24px 32px; align-items: start; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; padding: 16px; } header { padding: 16px; } }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 20px; }
  .form { position: sticky; top: 16px; }
  label { display: block; font-weight: 600; font-size: 13px; margin: 14px 0 6px; } label:first-child { margin-top: 0; }
  .hint { font-weight: 400; color: var(--muted); }
  textarea, input, select { width: 100%; font: inherit; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: #fff; color: var(--ink); }
  textarea { resize: vertical; font-size: 13px; font-family: ui-monospace, monospace; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .primary { margin-top: 18px; width: 100%; background: var(--accent); color: #fff; border: 0; border-radius: 10px; padding: 12px; font: 600 15px Inter, sans-serif; cursor: pointer; }
  .primary:disabled { opacity: .6; cursor: wait; }
  .mode { display: flex; gap: 8px; align-items: center; margin-top: 12px; font-size: 13px; color: var(--muted); } .mode select { width: auto; padding: 6px 8px; }
  .empty { color: var(--muted); text-align: center; padding: 60px 20px; }
  .results { display: grid; gap: 18px; }
  h2 { font-family: Fraunces, serif; font-size: 19px; margin: 0 0 12px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .pill { font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
  .ok { color: var(--pass); background: var(--pass-bg); } .under { color: var(--unc); background: var(--unc-bg); } .bad { color: var(--fail); background: var(--fail-bg); }
  .week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; }
  @media (max-width: 1100px) { .week { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .day h4 { margin: 0 0 6px; font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .shift { background: #fff; border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 8px; padding: 8px; margin-bottom: 6px; font-size: 13px; }
  .shift b { display: block; } .shift .who { color: var(--accent); font-weight: 600; } .shift .why { color: var(--muted); font-size: 12px; }
  .shift.kitchen { border-left-color: #c26a2e; } .shift.cleaning { border-left-color: #3a6ea5; } .shift.outdoor { border-left-color: #2e7d4f; } .shift.errands { border-left-color: #7a4fa0; }
  .shift.open { border-left-color: var(--fail); background: var(--fail-bg); }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 8px 6px; border-top: 1px solid var(--line); vertical-align: top; }
  th { font-size: 12px; color: var(--muted); font-weight: 600; border-top: 0; }
  .bar { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; min-width: 80px; } .bar span { display: block; height: 100%; background: var(--pass); }
  .bar span.under { background: var(--unc); }
  pre { white-space: pre-wrap; font: 14px/1.5 Inter, sans-serif; background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin: 0 0 10px; }
  .copy { font-size: 12px; font-family: Inter, sans-serif; background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 4px 10px; cursor: pointer; }
  .steps { display: grid; gap: 12px; } .stepline { display: flex; gap: 12px; align-items: center; font-weight: 500; }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--line); flex: none; }
  .stepline.active .dot { background: var(--accent); animation: pulse 1s infinite; } .stepline.done .dot { background: var(--pass); } .stepline.waiting { color: var(--muted); }
  .stepline small { color: var(--muted); font-weight: 400; } @keyframes pulse { 50% { opacity: .3; } }
  .banner { background: var(--unc-bg); color: var(--unc); border-radius: 10px; padding: 10px 14px; font-size: 13px; }
  .log { padding: 0; } .log li { margin-bottom: 8px; list-style: none; } .log .meta { font-size: 12px; color: var(--muted); }
  .stats { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
  .foot { color: var(--muted); font-size: 13px; text-align: center; }
</style>
</head>
<body>
<header>
  <h1>CoopOS</h1>
  <nav class="tabs"><a class="tab" href="index.html">Governance</a><a class="tab on" href="workshift.html">Workshifts</a></nav>
  <p>Paste the house's members and shifts. Get a fair weekly plan, an announcement and reminders.</p>
</header>
<main>
  <section class="card form">
    <label for="members">Members and their notes <span class="hint">· one per line · "Name: notes | done Xh last week"</span></label>
    <textarea id="members" rows="7">Maya: can't do Thursdays, prefers kitchen | done 4
Leo: busy on Monday and Tuesday, hates bathrooms | done 2
Priya: away this weekend, likes cleaning | done 4
Sam: no Wednesdays | done 1
Noah: happy to do anything | done 4
Ava: can't do Fridays or weekends, loves cooking | done 3</textarea>

    <label for="shifts">Shifts this week <span class="hint">· "Task | Day | Hours"</span></label>
    <textarea id="shifts" rows="8">Cook dinner | Mon | 3
Dishes after dinner | Mon | 1
Clean bathrooms | Tue | 2
Cook dinner | Wed | 3
Dishes after dinner | Wed | 1
Sweep and mop common room | Thu | 2
Trash and recycling | Thu | 1
Cook dinner | Fri | 3
Dishes after dinner | Fri | 1
Groceries pickup | Sat | 2
Garden and porch | Sat | 2
Deep clean kitchen | Sun | 3</textarea>

    <div class="row">
      <div><label for="target">Hours per member</label><input id="target" type="number" value="4" min="1" /></div>
      <div><label for="week">Week of</label><input id="week" type="date" /></div>
    </div>
    <label for="house">House name (optional)</label>
    <input id="house" placeholder="e.g. Casa Zimbabwe" />

    <div class="mode">Agents:
      <select id="mode"><option value="mock">Demo (offline)</option><option value="live">Live AI</option></select>
      <span id="liveNote"></span>
    </div>
    <button class="primary" id="run">Build this week's plan</button>
  </section>

  <section id="out"><div class="card empty">Paste your members and shifts, then click <b>Build this week's plan</b>.<br/>The AI reads the notes, the scheduler does the math. The manager decides.</div></section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const DAYS = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
(function () { const d = new Date(); const add = (8 - d.getDay()) % 7 || 7; d.setDate(d.getDate() + add); $("week").value = d.toISOString().slice(0, 10); })();

fetch("/api/status").then((r) => r.json()).then((s) => {
  if (!s.liveAvailable) { $("mode").querySelector('[value="live"]').disabled = true; $("liveNote").textContent = "(add an API key to enable live)"; }
}).catch(() => {});

const STEPS = [
  ["Availability agent", "reading members' notes"],
  ["Scheduler", "assigning shifts fairly"],
  ["Workshift agent", "drafting the announcement and reminders"],
];
function showSteps(cur) {
  $("out").innerHTML = `<div class="card"><h2>Your AI team is working</h2><div class="steps">${STEPS.map(([n, d], i) =>
    `<div class="stepline ${i < cur ? "done" : i === cur ? "active" : "waiting"}"><span class="dot"></span><span>${n} <small>· ${i < cur ? "done" : i === cur ? d + "…" : "waiting"}</small></span></div>`).join("")}</div></div>`;
}
function copyBtn(id) { return `<button class="copy" onclick="navigator.clipboard.writeText(document.getElementById('${id}').innerText);this.textContent='Copied';setTimeout(()=>this.textContent='Copy',2000)">Copy</button>`; }

$("run").onclick = async () => {
  const btn = $("run"); btn.disabled = true; btn.textContent = "Agents working…";
  let i = 0; showSteps(0); const timer = setInterval(() => { if (i < 2) showSteps(++i); }, 700);
  try {
    const res = await fetch("/api/workshift", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({
      members: $("members").value, shifts: $("shifts").value, targetHours: $("target").value,
      weekOf: $("week").value, houseName: $("house").value, mode: $("mode").value,
    }) });
    const r = await res.json();
    if (r.error) throw new Error(r.error);
    await new Promise((ok) => setTimeout(ok, Math.max(0, 1500 - i * 700)));
    clearInterval(timer); showSteps(3); await new Promise((ok) => setTimeout(ok, 300));
    render(r);
  } catch (e) { clearInterval(timer); $("out").innerHTML = `<div class="card" style="color:var(--fail)">Error: ${esc(e.message)}</div>`; }
  btn.disabled = false; btn.textContent = "Build this week's plan";
};

function render(r) {
  const under = r.members.filter((m) => m.status === "under").length;
  const week = DAYS.map((d) => {
    const items = r.assignments.filter((a) => a.day === d).map((a) =>
      `<div class="shift ${a.category}"><b>${esc(a.name)}</b><span class="who">${esc(a.member)}</span> · ${a.hours}h${a.why ? `<div class="why">${esc(a.why)}</div>` : ""}</div>`).join("");
    const open = r.unfilled.filter((u) => u.day === d).map((u) =>
      `<div class="shift open"><b>${esc(u.name)}</b>Open · ${u.hours}h<div class="why">${esc(u.reason)}</div></div>`).join("");
    return `<div class="day"><h4>${d}</h4>${items}${open}</div>`;
  }).join("");
  $("out").innerHTML = `<div class="results">
    ${r.fallback ? `<div class="banner">Live AI was unavailable, the demo agents were used instead.</div>` : ""}
    <div class="card">
      <h2>This week's plan</h2>
      <div class="stats">
        <span class="pill ${r.unfilled.length ? "bad" : "ok"}">${r.assignments.length}/${r.assignments.length + r.unfilled.length} shifts filled</span>
        <span class="pill ${under ? "under" : "ok"}">${under} member${under === 1 ? "" : "s"} under target</span>
        <span class="pill ${r.totalOffered < r.totalNeeded ? "under" : "ok"}">${r.totalOffered}h of shifts for ${r.totalNeeded}h owed</span>
      </div>
      <div class="week">${week}</div>
    </div>
    <div class="card">
      <h2>Members</h2>
      <table><tr><th>Member</th><th>This week</th><th></th><th>Last week</th><th>Constraints read by the AI</th></tr>
      ${r.members.map((m) => {
        const p = r.people.find((x) => x.name === m.name) || {};
        const cons = [p.unavailableDays?.length ? "off " + p.unavailableDays.join(", ") : "", p.prefers?.length ? "prefers " + p.prefers.join(", ") : "", p.avoids?.length ? "avoids " + p.avoids.join(", ") : ""].filter(Boolean).join(" · ") || "none";
        return `<tr><td><b>${esc(m.name)}</b></td><td>${m.hours}/${m.target}h</td>
          <td><div class="bar"><span class="${m.status}" style="width:${Math.min(100, (m.hours / m.target) * 100)}%"></span></div></td>
          <td>${m.lastWeekDone == null ? "n/a" : `<span class="pill ${m.behindLastWeek ? "under" : "ok"}">${m.lastWeekDone}h</span>`}</td>
          <td style="color:var(--muted);font-size:13px">${esc(cons)}</td></tr>`;
      }).join("")}</table>
    </div>
    <div class="card">
      <h2>Announcement ${copyBtn("ann")}</h2>
      <pre id="ann"><b>Subject:</b> ${esc(r.announcement.subject)}\n\n${esc(r.announcement.body)}</pre>
    </div>
    <div class="card">
      <h2>Reminders <span class="pill under">${r.reminders.length} to send</span></h2>
      ${r.reminders.length ? r.reminders.map((x, i) => `<p style="margin:0 0 6px;display:flex;justify-content:space-between;align-items:center"><b>To ${esc(x.to)}</b>${copyBtn("rem" + i)}</p><pre id="rem${i}">${esc(x.body)}</pre>`).join("") : "<p>Everyone did their hours last week.</p>"}
    </div>
    <div class="card"><h2>Agent log <span class="pill" style="background:#eee;color:#555">${r.mode === "live" ? "Live AI" : "Demo mode"}</span></h2>
      <ul class="log">${r.log.map((l) => `<li><b>${esc(l.agent)}</b>: ${esc(l.action)}<div class="meta">${esc(l.summary)} · ${l.ms} ms</div></li>`).join("")}</ul>
    </div>
    <p class="foot">AI reads and drafts. Code schedules. The workshift manager decides. Nothing is sent automatically.</p>
  </div>`;
}
</script>
</body>
</html>
